[package]
name = "aerospike-py-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz_write_int"
path = "fuzz_targets/fuzz_write_int.rs"
doc = false

[[bin]]
name = "fuzz_write_bytes"
path = "fuzz_targets/fuzz_write_bytes.rs"
doc = false

[[bin]]
name = "fuzz_write_float"
path = "fuzz_targets/fuzz_write_float.rs"
doc = false

[dependencies]
libfuzzer-sys = "0.4"
# The targets call the production buffer writer and reader through the safe
# shims in `_aerospike::fuzzing` (the library's name is `_aerospike`). The
# crate links libpython, as `cargo test` does: PyO3 finds the interpreter from
# PYO3_PYTHON or the `python3` on PATH.
aerospike-py-native = { path = "..", features = ["fuzzing"] }

[workspace]
members = ["."]
