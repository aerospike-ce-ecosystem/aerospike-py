[package]
name = "aerospike-py-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# MSRV: 1.87 is the floor that the *dependency tree* requires. The
# resolved lock graph pulls in `aerospike-rt 2.0.0`, whose manifest
# declares `rust-version = "1.87"`, so cargo refuses to build the graph
# on older toolchains with `aerospike-rt@2.0.0 requires rustc 1.87`.
# This 1.87 floor subsumes the intermediate 1.85 requirement from
# `block-buffer 0.12.0` (via `digest 0.11`), whose manifest declares
# `edition = "2024"` (stabilised in Rust 1.85), and the older 1.80 floor
# the crate's own code needed (a handful of std items stabilised in
# 1.77 / 1.80, plus `Mutex::clear_poison()` (1.74+) used by
# `PyLazyBatchRecords::release_cache` in PR #374).
# Pinning this here gives cargo a clear "package requires 1.87" error
# on older toolchains instead of a cryptic resolver failure during a
# `pip install --no-binary` / `cargo install` build.
rust-version = "1.87"

[lib]
name = "_aerospike"
# rlib enables `cargo test` (cdylib alone does not produce a test binary).
# See: https://pyo3.rs/latest/building-and-distribution.html#testing
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.2" }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
aerospike = { version = "2.0.0", features = ["async", "rt-tokio"], default-features = false }
aerospike-core = { version = "2.0.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
arc-swap = "1"
futures = "0.3"
half = "2"
ripemd = "0.2"
log = "0.4"
rand = "0.10"
prometheus-client = "0.24"
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }

[dev-dependencies]
# Compile-time layout guards for the test-only #[repr(C)] mirror struct
# used to construct aerospike_core::BatchRecord fixtures (see client_ops.rs).
static_assertions = "1"

[features]
# extension-module activates pyo3/extension-module which avoids linking Python.
# Must be enabled when building the Python extension (maturin handles this).
# Do NOT enable during `cargo test` — omitting it lets the linker find Python.
extension-module = ["pyo3/extension-module"]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

# Profiling: keep line-number debug info in release builds so Tachyon `--native`
# can resolve Rust function names (record_to_py_inner / value_to_py / key_to_py
# instead of opaque <native>). Adds ~5% to wheel size; perf impact negligible.
[profile.release]
debug = 2
strip = "none"
split-debuginfo = "off"
