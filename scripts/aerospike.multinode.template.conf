# Aerospike CE node of the two-node cluster in compose.multinode.yaml.
#
# Each node advertises 127.0.0.1 and its own published port, so a client on
# the host reaches both nodes through the port mappings. The nodes find each
# other over the compose network by service name.

service {
	cluster-name ${CLUSTER_NAME}
	# A fixed node id. Left to itself the server derives the id from the
	# container's network interface, which changes every time the container
	# starts; the client then sees a restarted node as a different node.
	node-id ${NODE_ID}
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
		access-address 127.0.0.1
		access-port ${ACCESS_PORT}
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		mesh-seed-address-port ${MESH_SEED_1} 3002
		mesh-seed-address-port ${MESH_SEED_2} 3002
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}
}

namespace ${NAMESPACE} {
	# Two copies: stopping one node loses no record, so a test can tell
	# "the write was applied" from "the write was lost" afterwards.
	replication-factor 2
	default-ttl 0

	storage-engine memory {
		data-size 1G
	}
}
