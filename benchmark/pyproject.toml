[project]
name = "aerospike-py-benchmark"
version = "0.1.0"
description = "uvicorn ASGI 위에서 aerospike-py vs 공식 aerospike Python client 성능 비교"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aerospike-py",
    "aerospike>=19.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "httpx>=0.27.0,<1",
    "numpy>=2.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
aerospike-py = { path = "../", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
