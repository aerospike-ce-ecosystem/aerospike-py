service {
	cluster-name ${CLUSTER_NAME}
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address ${SERVICE_ADDRESS}
		port ${SERVICE_PORT}
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace ${NAMESPACE} {
	replication-factor 1
	default-ttl 0

	storage-engine memory {
		data-size 1G
	}
}
