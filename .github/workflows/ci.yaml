name: CI
# Rust build + Python 3.10~3.15 unit tests (incl. 3.13t/3.14t/3.15t free-threaded)
# + integration tests + concurrency tests + compatibility tests + lint + security audit

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yaml'

  workflow_dispatch:
    inputs:
      server_version:
        description: 'Aerospike server version (Docker tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AEROSPIKE_PORT: "3000"
  # Mirrors `rust-version` in rust/Cargo.toml. Defined at workflow level
  # (not job level) so it is available inside `name:` expressions; using
  # `${{ env.MSRV }}` in `jobs.<id>.name` is evaluated before job-level
  # `env:` is in scope and causes "Unrecognized named-value: 'env'".
  MSRV: "1.80"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --no-install-project

      - name: Run pre-commit
        run: uvx pre-commit run --all-files

      # Mirrors the cargo-clippy pre-commit hook's manifest path / features so
      # the Rust #[cfg(test)] suites actually execute in CI (previously they
      # never ran — only pre-commit, clippy, and Python tox did).
      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml --features otel

  msrv-check:
    # Note: `name:` at job level cannot reference `env.MSRV` (env context
    # is not available during workflow parsing). The version below is the
    # display string; the actual MSRV is read from `env.MSRV` defined at
    # the workflow level, and the drift-gate step below keeps them in sync.
    name: MSRV cargo check (Rust 1.80)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Drift gate: refuse to run cargo check on a fictitious MSRV.
      # If a future PR bumps `rust-version = "1.85"` in rust/Cargo.toml
      # but forgets to update `MSRV: "..."` above (or vice versa), this
      # step fails *before* the check job runs, surfacing the drift
      # rather than silently pinning a stale toolchain.
      - name: Verify MSRV matches rust/Cargo.toml
        run: |
          declared=$(awk -F\" '/^rust-version *=/ {print $2; exit}' rust/Cargo.toml)
          if [ -z "$declared" ]; then
            echo "::error file=rust/Cargo.toml::rust-version is missing from [package] — required to back the msrv-check job"
            exit 1
          fi
          if [ "$declared" != "${{ env.MSRV }}" ]; then
            echo "::error::MSRV drift: workflow declares ${{ env.MSRV }} but rust/Cargo.toml declares $declared. Update both in the same PR."
            exit 1
          fi
          echo "MSRV in workflow (${{ env.MSRV }}) matches rust/Cargo.toml ($declared)."

      - name: Install Rust ${{ env.MSRV }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-msrv"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo check` (not `cargo build` / `cargo test`) is enough to surface
      # an MSRV regression: any item stabilised after 1.80 used by either the
      # crate code or its `#[cfg(test)]` modules will fail to resolve here
      # while the @stable jobs still build, mirroring what a downstream
      # `pip install --no-binary` / `cargo install` user would hit.
      - name: cargo check on MSRV toolchain
        run: cargo check --manifest-path rust/Cargo.toml --features otel --all-targets

  build:
    name: Build & Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 3.15 is alpha — let it report status without blocking the merge gate.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
          - python-version: "3.15"
            tox-env: py315
            experimental: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run unit tests
        run: uvx --with tox-uv tox -e ${{ matrix.tox-env }}

  build-freethreaded:
    # Free-threaded (no-GIL) builds. The crate ships
    # #[pymodule(gil_used = false)] so unit tests are expected to pass on
    # every free-threaded CPython without re-enabling the GIL at import.
    name: Build & Unit Tests (Python ${{ matrix.python-version }} free-threaded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13t"
            tox-env: py313t
            experimental: true  # 3.13t was experimental upstream
          - python-version: "3.14t"
            tox-env: py314t
          - python-version: "3.15t"
            tox-env: py315t
            experimental: true  # 3.15 is alpha
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build-freethreaded-${{ matrix.python-version }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install free-threaded Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify GIL is actually disabled
        run: |
          uv run --python ${{ matrix.python-version }} python -c "import sys; assert not sys._is_gil_enabled(), 'GIL must be OFF for free-threaded build'; print('GIL OFF on', sys.version)"

      - name: Run unit tests
        run: uvx --with tox-uv tox -e ${{ matrix.tox-env }}
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  integration:
    name: Integration Tests (AS ${{ matrix.server_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server_version: ${{ github.event.inputs.server_version && fromJSON(format('["{0}"]', github.event.inputs.server_version)) || fromJSON('["7.2", "latest"]') }}
    services:
      aerospike:
        image: aerospike/aerospike-server:${{ matrix.server_version }}
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002
        env:
          NAMESPACE: test
          CLUSTER_NAME: docker
          DEFAULT_TTL: 2592000
        options: >-
          --shm-size=1g
          --health-cmd "asinfo -v status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Wait for Aerospike
        uses: ./.github/actions/wait-for-aerospike

      - name: Run all tests
        run: uvx --with tox-uv tox -e all

  test-concurrency:
    name: Concurrency Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      aerospike:
        image: aerospike/aerospike-server:latest
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002
        env:
          NAMESPACE: test
          CLUSTER_NAME: docker
          DEFAULT_TTL: 2592000
        options: >-
          --shm-size=1g
          --health-cmd "asinfo -v status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Wait for Aerospike
        uses: ./.github/actions/wait-for-aerospike

      - name: Run concurrency tests
        run: uvx --with tox-uv tox -e concurrency

  test-concurrency-freethreaded:
    # End-to-end concurrency suite under a real free-threaded interpreter.
    # This is the single load-bearing test of the gil_used = false guarantee:
    # if shared state across threads in the Rust extension were unsafe under
    # no-GIL semantics, these tests would surface it.
    name: Concurrency Tests (Python ${{ matrix.python-version }} free-threaded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13t"
            tox-env: freethreading-py313t
            experimental: true
          - python-version: "3.14t"
            tox-env: freethreading-py314t
          - python-version: "3.15t"
            tox-env: freethreading-py315t
            experimental: true
    services:
      aerospike:
        image: aerospike/aerospike-server:latest
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002
        env:
          NAMESPACE: test
          CLUSTER_NAME: docker
          DEFAULT_TTL: 2592000
        options: >-
          --shm-size=1g
          --health-cmd "asinfo -v status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build-freethreaded-${{ matrix.python-version }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install free-threaded Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify GIL is actually disabled
        run: |
          uv run --python ${{ matrix.python-version }} python -c "import sys; assert not sys._is_gil_enabled(), 'GIL must be OFF for free-threaded build'; print('GIL OFF on', sys.version)"

      - name: Wait for Aerospike
        uses: ./.github/actions/wait-for-aerospike

      - name: Run free-threaded concurrency tests
        run: uvx --with tox-uv tox -e ${{ matrix.tox-env }}
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  feasibility:
    name: Feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      aerospike:
        image: aerospike/aerospike-server:latest
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002
        env:
          NAMESPACE: test
          CLUSTER_NAME: docker
          DEFAULT_TTL: 2592000
        options: >-
          --shm-size=1g
          --health-cmd "asinfo -v status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Wait for Aerospike
        uses: ./.github/actions/wait-for-aerospike

      - name: Run feasibility test
        run: uvx --with tox-uv tox -e feasibility

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # rustsec/audit-check creates a check-run summarizing the audit result.
    # Workflow-level permission is `contents: read`, so this job needs an
    # explicit elevation for `checks: write` — otherwise it fails with
    # HTTP 403 "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0097: `rand` is unsound only when a custom logger
          # defined by the application itself calls `rand::rng()` while
          # reseeding. aerospike-py's custom log bridge (rust/src/logging.rs)
          # does not touch `rand`; thread_rng usage is confined to
          # exponential-backoff jitter in rust/src/client_ops.rs.
          # The unsound trigger cannot be reached through public API.
          # Full rationale: see SECURITY.md > "RUSTSEC Advisory Ignore List".
          ignore: RUSTSEC-2026-0097

  compatibility:
    name: Compatibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      aerospike:
        image: aerospike/aerospike-server:latest
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002
        env:
          NAMESPACE: test
          CLUSTER_NAME: docker
          DEFAULT_TTL: 2592000
        options: >-
          --shm-size=1g
          --health-cmd "asinfo -v status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "rust-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Wait for Aerospike
        uses: ./.github/actions/wait-for-aerospike

      - name: Run compatibility tests
        run: uvx --with tox-uv tox -e compat
