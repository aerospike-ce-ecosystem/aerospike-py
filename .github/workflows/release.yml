name: Create GitHub Release

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: changes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # Only commits that touch user-facing library code or package metadata count
          # toward a release. CI workflows, docs, tests, examples, build configs, etc.
          # don't change what gets shipped to PyPI and so don't warrant a new release.
          # (Note: the historical `docs: freeze version` commits no longer occur —
          # versioned docs were dropped along with docs-version.yaml.)
          RELEASE_PATHS=(rust/ src/ pyproject.toml Cargo.toml Cargo.lock uv.lock)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found. Checking all commits."
            COMMIT_COUNT=$(git log HEAD --pretty=tformat:"%H" -- "${RELEASE_PATHS[@]}" | wc -l | tr -d ' ')
          else
            COMMIT_COUNT=$(git log "${LATEST_TAG}..HEAD" --pretty=tformat:"%H" -- "${RELEASE_PATHS[@]}" | wc -l | tr -d ' ')
          fi
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release-worthy changes since ${LATEST_TAG}. Skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${COMMIT_COUNT} release-worthy commits since ${LATEST_TAG}."
          fi

      - name: Determine next version
        if: steps.changes.outputs.skip == 'false'
        id: version
        run: |
          LATEST_TAG="${{ steps.changes.outputs.latest_tag }}"
          if [ -z "$LATEST_TAG" ]; then
            echo "next_version=v0.0.1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip 'v' prefix for parsing
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Feature commits bump the minor version; other changes bump the patch.
          # Major bump is manual: a maintainer tags the new major version themselves.
          # `feat!:` / `BREAKING CHANGE` markers surface in release notes, not in version.
          # Only feat commits that touch release-worthy paths trigger a minor bump —
          # `feat(ci):` or `feat(docs):` shouldn't bump the public version.
          RELEASE_PATHS=(rust/ src/ pyproject.toml Cargo.toml Cargo.lock uv.lock)
          HAS_FEAT=$(git log "${LATEST_TAG}..HEAD" --pretty=tformat:"%s" -- "${RELEASE_PATHS[@]}" | grep -cE '^feat(\(.+\))?!?:' || true)

          if [ "$HAS_FEAT" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${LATEST_TAG} → ${NEXT}"

      - name: Generate release notes with Claude
        if: steps.changes.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          bot_id: '${{ vars.CLAUDE_BOT_ID }}'
          bot_name: '${{ vars.CLAUDE_BOT_NAME }}'
          prompt: |
            You are a release manager for the **aerospike-py** project.

            ## Task
            Write the release notes for version **${{ steps.version.outputs.next_version }}**.
            Previous version: **${{ steps.changes.outputs.latest_tag }}** (${{ steps.changes.outputs.commit_count }} commits)

            ### Step 1: Analyze Changes
            Run `git log ${{ steps.changes.outputs.latest_tag }}..HEAD --pretty=format:"%h %s" --no-merges` to see all commits.

            ### Step 2: Write Release Notes
            Write release notes in this exact format (Korean descriptions, English technical terms):

            ```
            ## What's Changed

            ### Features
            - **feature name**: description (#PR)

            ### Bug Fixes
            - **fix name**: description (#PR)

            ### Improvements
            - **improvement name**: description (#PR)

            ### CI/CD
            - description

            ### Dependencies
            - description

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changes.outputs.latest_tag }}...${{ steps.version.outputs.next_version }}
            ```

            Only include sections that have entries. Skip empty sections.

            ### Step 3: Save the Release Notes
            Write the Markdown notes to `$RUNNER_TEMP/release-notes.md` for the publish step.
            Stop after writing the notes.

            ## Constraints
            - Use Korean for descriptions, English for technical terms
            - Group by Conventional Commit type (feat → Features, fix → Bug Fixes, etc.)
            - Include PR numbers where available (extract from commit messages)
            - Do NOT include merge commits or trivial changes (typos, formatting)
          claude_args: |
            --max-turns ${{ vars.CLAUDE_MAX_TURNS }}
            --model ${{ vars.CLAUDE_MODEL }}
            --dangerously-skip-permissions
          settings: '${{ vars.CLAUDE_SETTINGS }}'

      - name: Publish GitHub release at the dispatch commit
        if: steps.changes.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.next_version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          test -s "$notes"
          # Creating the ref never moves an existing tag. Accept a pre-existing
          # tag only if it resolves to the same commit (including annotated tags).
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent; then
            tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag $TAG points to $tagged_sha, expected $GITHUB_SHA"
              exit 1
            fi
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "release $TAG" --notes-file "$notes"
