name: Publish to PyPI
# On GitHub Release: builds wheels with maturin and publishes to PyPI
# Coverage: Linux (x86_64/aarch64), macOS (x86_64/aarch64), Windows (x64)
#           Python 3.10 ~ 3.14 (standard) + 3.14t (free-threaded, Linux/macOS only)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    # Only run for valid PEP 440 dot-separated tags: vX.Y.Z or vX.Y.Z.alpha4 (not v0.0.1alpha4)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.release.tag_name, 'v') &&
        (
          (!contains(github.event.release.tag_name, 'alpha') && !contains(github.event.release.tag_name, 'beta') && !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, 'dev')) ||
          contains(github.event.release.tag_name, '.alpha') ||
          contains(github.event.release.tag_name, '.beta') ||
          contains(github.event.release.tag_name, '.rc') ||
          contains(github.event.release.tag_name, '.dev')
        )
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-14
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7

      # Installed FIRST, on purpose. actions/setup-python prepends every
      # install to PATH and the free-threaded framework symlinks
      # `python3.14 -> python3.14t`, so installing 3.14t last would leave
      # `--find-interpreter` resolving `python3.14` to the free-threaded build
      # and no cp314-cp314 macOS wheel would ever be produced (releases 0.13.0
      # through 0.14.2 shipped without one). With 3.14t first, the GIL 3.14 of
      # the next step wins the `python3.14` name while `python3.14t` is still
      # discoverable further down PATH; maturin keys its interpreter dedup on
      # gil_disabled, so it keeps both.
      #
      # 3.14t is not officially distributed on Windows yet (the
      # actions/python-versions manifest publishes no win-x64 build of cpython
      # 3.14t at time of writing), so install it only on Linux/macOS.
      - name: Install free-threaded Python 3.14t (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: 3.14t
          allow-prereleases: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
          allow-prereleases: true

      - name: Extract version and update Cargo.toml
        id: version
        uses: ./.github/actions/extract-version
        with:
          event_name: ${{ github.event_name }}
          tag_name: ${{ github.event.release.tag_name }}
          ref_name: ${{ github.ref_name }}
          ref: ${{ github.ref }}
          run_number: ${{ github.run_number }}

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: 2_28

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          args: --release --out dist --find-interpreter

      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter

      # maturin never reports the interpreters it did not find, so a runner
      # that loses one publishes a release with a hole in it. Fail here
      # instead: every classifier in pyproject.toml needs a wheel, or
      # `pip install aerospike-py` falls back to the sdist and demands a Rust
      # toolchain.
      - name: Verify wheel matrix
        run: python scripts/check-wheel-matrix.py dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 7

  sdist:
    name: Build source distribution
    # Only run for valid PEP 440 dot-separated tags: vX.Y.Z or vX.Y.Z.alpha4 (not v0.0.1alpha4)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.release.tag_name, 'v') &&
        (
          (!contains(github.event.release.tag_name, 'alpha') && !contains(github.event.release.tag_name, 'beta') && !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, 'dev')) ||
          contains(github.event.release.tag_name, '.alpha') ||
          contains(github.event.release.tag_name, '.beta') ||
          contains(github.event.release.tag_name, '.rc') ||
          contains(github.event.release.tag_name, '.dev')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version and update Cargo.toml
        id: version
        uses: ./.github/actions/extract-version
        with:
          event_name: ${{ github.event_name }}
          tag_name: ${{ github.event.release.tag_name }}
          ref_name: ${{ github.ref_name }}
          ref: ${{ github.ref }}
          run_number: ${{ github.run_number }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aerospike-py
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List dist contents
        run: ls -la dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aerospike-py
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List dist contents
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
