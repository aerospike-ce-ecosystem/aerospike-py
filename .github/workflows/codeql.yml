name: codeql
# GitHub-native static analysis. Results land in the repository's Security tab
# under Code scanning, and on pull requests as inline annotations.
#
# Added because no repository in the organisation ran any code scanning, while
# this one publishes wheels to PyPI.
# See aerospike-ce-ecosystem/project-hub#160.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries are applied to code that is not changing.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Required to upload results to the code-scanning API.
      security-events: write
      # Required by the CodeQL action to read workflow run status.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # src/aerospike_py/ wrapper and stubs
          - language: python
            build-mode: none
          # rust/ — the PyO3 core, which is what runs inside a user's process
          # and what the wheel ships. `none` is the only build mode CodeQL has
          # for Rust: it reads the crate through rust-analyzer and never links
          # it, so the `extension-module` feature this crate keeps off under
          # `cargo test` does not come into it. It needs Cargo.toml (present)
          # and rustup/cargo on the runner (ubuntu-latest has both).
          - language: rust
            build-mode: none
          # docs/ only: the Docusaurus site's configuration and components.
          # Nothing of this is in the wheel.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
