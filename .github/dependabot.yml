version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      rust-deps:
        patterns:
          - "*"
    # Minor/patch updates stay muted to keep PR noise down — except for the
    # Aerospike client crates, which carry the client's own bug fixes.
    # `ignore` has no negation, so the freeze is spelled out per direct
    # dependency instead of `- dependency-name: "*"`; anything added to
    # rust/Cargo.toml later gets minor/patch PRs until it is listed here.
    #
    # Why: aerospike-core 2.1.0 fixed `Cluster::close()` leaving the cluster
    # tend task (and its node sockets) running forever, and the wildcard
    # ignore meant this repo sat on 2.0.0 — leaking a task and a socket per
    # connect/close cycle — until someone noticed by hand.
    ignore:
      - dependency-name: "pyo3*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "opentelemetry*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "tokio"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "arc-swap"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "futures"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "half"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "ripemd"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "log"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "prometheus-client"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "static_assertions"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      gha-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
